<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Terrenario">
  <title>Terrenario</title>
  <!--
    MVP-710 — Icono de marca de Terrenario.

    Reproduce el mismo distintivo que la aplicacion ya pinta en la barra lateral, el Home, el acceso y
    la landing: baldosa verde oliva (#33450d) con el glifo `eco` en blanco. No se inventa identidad
    nueva; se lleva fuera de la pantalla la que el producto ya tiene.

    El glifo es Material Symbols Outlined `eco` con FILL 1, el mismo que renderiza la fuente
    autoalojada de MVP-505 (Apache-2.0, Google). Va como trazado y no como texto para que el icono no
    dependa de ninguna fuente: un favicon se pinta antes de que exista CSS.

    Geometria (viewBox 512): la tinta del glifo mide 678x683 en la rejilla de 960 del original y su
    centro cae en (458.5, -422), no en el centro de la caja em. La transformacion la recoloca en
    (256, 256) y la escala al 50 % de la baldosa —algo mas que el ~42 % de la cabecera de la app—
    porque a 16 px el margen no aporta nada y la hoja si.

    El radio es 112 (22 %) y no el 30 % de `rounded-xl` del lockup: a 16 px ese radio se come las
    esquinas y la baldosa deja de leerse como cuadrada.
  -->
  <rect width="512" height="512" rx="112" fill="#33450d"/>
  <path transform="translate(82.7 415.5) scale(.378)" fill="#fff" d="M444-80q-42 0-78.5-8T298-112q32-119 87.5-230.5T535-529q-112 54-194.5 150T228-161q-4-4-7.5-7t-7.5-7q-45-45-69-103t-24-122q0-69 26-133t75-113q77-79 200-102.5t368-6.5q19 238-5.5 365T679-183q-48 50-109 76.5T444-80Z"/>
</svg>
